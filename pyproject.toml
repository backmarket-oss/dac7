[project]
name = "dac7"
version = "2025.0.0" # x-release-please-version
description = "Tooling for DAC7"
readme = "README.md"
license-files = [
    "LICENSE.md",
]
authors = [
    { name = "Nicolas Bonnotte", email = "nicolas.bonnotte@backmarket.com" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.5.0,<9.0.0",
    "annotated-types>=0.8.0,<0.9.0",
    "pydantic>=2.5.2,<3.0.0",
    "python-gnupg>=0.5.2,<0.6.0",
    "requests>=2.31.0,<3.0.0",
    "typer>=0.27.0,<0.28.0",
    "xmlschema>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/BackMarket-oss/dac7"

[project.scripts]
dac7 = "dac7.main:app"

[dependency-groups]
dev = [
    "factory-boy>=3.3.1,<4.0.0",
    "mypy>=2.0.0,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "types-requests>=2.31.0,<3.0.0",
    "virtualenv>=21.0.0,<22.0.0",
    "xenon>=0.9.1,<0.10.0",
]

[tool.uv]
keyring-provider = "subprocess"
exclude-newer = "1 week"

[tool.uv.build-backend]
module-name = "dac7"
module-root = "cli/src"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.bandit]
exclude_dirs = ["cli/tests"]
skips = []

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.coverage.run]
source = ["cli/src"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
  # Don't complain if tests don't hit defensive assertion code:
  "raise NotImplementedError",
  "pragma: no cover", # Coverage is not expected on pytest.fail() calls in tests
  ".*pytest.fail.*",
]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
allow_incomplete_defs = false
check_untyped_defs = true
enable_error_code = ["ignore-without-code"]
files = ["dac7"]
mypy_path = ["cli/src", "cli/stubs"]
explicit_package_bases = true
no_implicit_optional = true
python_version = "3.11"
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = []

[tool.pytest.ini_options]
# Make sure that warnings raise errors, to handle things like deprecations as soon as possible.
filterwarnings = [
    "error",
]

[tool.ruff]
fix = true
line-length = 120
target-version = "py312"

[tool.ruff.lint]
fixable = ["I"]
ignore = [
  "A003", # line too long (already checked by black)
]
select = [
  "YTT", # flake8-2020
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "C4", # flake8-comprehensions
  "T10", # flake8-debugger
  "INP", # flake8-no-pep420
  "T20", # flake8-print
  "PT", # flake8-pytest-style
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "I", # isort
  "C90", # mccabe
  "E", # pycodestyle
  "W", # pycodestyle
  "F", # pyflakes
  "PGH", # pygrep-hooks
  "RUF", # ruff
]

[tool.ruff.lint.per-file-ignores]
"cli/tests/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
section-order = ["future", "standard-library", "first-party", "third-party", "local-folder"]
